[project]
name = "games-workspace"
version = "0.0.0"
description = "Ferramenta de desenvolvimento local (pytest/ruff/mypy + imports editaveis). Nao e publicada nem instalada em producao - ver CLAUDE.md."
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1,<3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamepanel", "src/gamebroker"]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
# Saiu do `pytest.ini` para ca (secao 2 do `docs/architecture-proposal.md`): um arquivo a
# menos na raiz, e a configuracao de teste ao lado da de ruff e mypy. O pytest le esta
# secao desde a 6.0 — a do apt no container do painel e a 8.3, conferida.
#
# As suites do painel vivem em tests/gamepanel/, testando o pacote instalado (editavel,
# via uv) `gamepanel` em src/gamepanel/. As do broker vivem em tests/gamebroker/, testando
# `gamebroker` em src/gamebroker/. Import por nome de arquivo (`from conftest import X`,
# `from test_ssh_installer import Y`) funciona porque nem tests/ nem tests/<pacote>/ tem
# __init__.py: o pytest insere o diretorio de cada arquivo (nao a raiz do repo) no
# sys.path.
testpaths = ["tests"]
python_files = ["test_*.py"]

# -r fE: resumo no fim com as que falharam e as que deram erro. Sem isso, num arquivo
# de 40 testes, a linha que interessa fica perdida no meio da saida.
#
# -p no:cacheprovider: `src/gamepanel` entra no container de dev como bind mount SOMENTE
# LEITURA (docker-compose.yml) - e por isso que o codigo pode ser editado ao vivo sem
# rebuild. O cache de teste (".last failed", nodeids) quer escrever ali dentro e nao
# consegue; desligado, some o aviso sem perder nada, porque nenhuma suite aqui depende
# de cache entre execucoes.
addopts = "-q -r fE -p no:cacheprovider"

# DeprecationWarning atribuida a um modulo DESTE pacote e erro: o painel nao usa asyncio
# nem rede nos testes, e qualquer aviso aqui e sinal de que algo novo entrou sem querer.
#
# O filtro e o PREFIXO do pacote, e nao uma lista de modulos. A lista anterior tinha tres
# nomes e um deles (`gamepanel.games.gamefields`) havia sido dividido em `games/base.py` +
# `registry.py` + `adapters/` — um filtro apontando para modulo que nao existe nao avisa
# nada e ninguem descobre. O campo `module` casa com o `__name__` a que o aviso e
# ATRIBUIDO (o frame do `stacklevel`), nao com onde a funcao mora; conferido nos dois
# sentidos antes da troca.
filterwarnings = ["error::DeprecationWarning:gamepanel"]

[tool.ruff]
line-length = 120
target-version = "py313"
# Gerado por tools/import-linuxgsm.py a partir de dado de terceiros (LinuxGSM) - nao e
# escrito a mao, e as strings de aviso em varias linhas disparam ISC004 sem ser bug real.
extend-exclude = ["src/gamepanel/games/catalog/suggestions.py"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",     # pyflakes/pycodestyle/imports/pyupgrade/bugbear
    "BLE",                          # except Exception generico (o CLAUDE.md ja assume isso pros # noqa: BLE001)
    "S",                             # bandit: subprocess inseguro, senha/token hardcoded, except-pass...
    "SIM", "RUF",                     # simplificacoes e regras proprias do ruff
    "C90",                              # complexidade (mccabe) - proxy de cognitiva
    "PLR",                                # pylint refactor: too-many-arguments, too-many-branches...
    "ERA",                                  # codigo comentado
]
# Os `# noqa` que ja existem no codigo (ex.: `except Exception:  # noqa: BLE001` em
# gamebroker/ssh_install.py) so silenciam BLE001 com essa selecao - sem ela, RUF100 os
# marcaria como "unused noqa" (achado da Fase 1, ja corrigido no codigo, mas dependia
# desta config existir).

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
# Dispatcher por tipo (bool/int/float/str/fallback) e um padrao legitimo com varios
# returns; 6 (o padrao) marcava codigo assim como "complexo" sem ganho de leitura.
max-returns = 8

[tool.ruff.lint.per-file-ignores]
# Teste usa asserts, dado sintetico, nomes de fixture com "senha"/"token", e as vezes
# uma funcao com mais de 8 parametros ou mais complexa so pra montar cenario - regras de
# bandit e de contagem de parametro sao para codigo de producao, nao para teste.
"tests/**/*.py" = ["S", "PLR0913", "PLR0915", "PLR2004"]

[tool.mypy]
platform = "linux"
