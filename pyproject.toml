[project]
name = "games-workspace"
version = "0.0.0"
description = "Local development tooling (pytest/ruff/mypy + editable imports). Never published or installed in production - see CLAUDE.md."
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1,<3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamepanel", "src/gamebroker"]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
# Moved here from `pytest.ini` (section 2 of `docs/architecture-proposal.md`): one file fewer
# at the root, and the test configuration next to the ruff and mypy ones. pytest reads this
# section since 6.0 - the apt one in the panel container is 8.3, checked.
#
# The panel suites live in tests/gamepanel/, testing the installed package (editable, via
# uv) `gamepanel` in src/gamepanel/. The broker ones live in tests/gamebroker/, testing
# `gamebroker` in src/gamebroker/. Importing by file name (`from conftest import X`,
# `from test_ssh_installer import Y`) works because neither tests/ nor tests/<package>/ has
# an __init__.py: pytest inserts the directory of each file (not the repo root) into
# sys.path.
testpaths = ["tests"]
python_files = ["test_*.py"]

# -r fE: summary at the end with the tests that failed and the ones that errored. Without it,
# in a 40-test file, the line that matters gets lost in the middle of the output.
#
# -p no:cacheprovider: `src/gamepanel` enters the dev container as a READ-ONLY bind mount
# (docker-compose.yml) - that is why the code can be edited live without a rebuild. The
# test cache (".last failed", nodeids) wants to write in there and cannot; turned off, the
# warning goes away without losing anything, because no suite here depends on a cache
# between runs.
addopts = "-q -r fE -p no:cacheprovider"

# A DeprecationWarning attributed to a module of THIS package is an error: the panel uses
# neither asyncio nor network in the tests, and any warning here is a sign that something
# new slipped in by accident.
#
# The filter is the package PREFIX, not a list of modules. The previous list had three
# names and one of them (`gamepanel.games.gamefields`) had been split into `games/base.py` +
# `registry.py` + `adapters/` - a filter pointing to a module that does not exist warns
# about nothing and nobody finds out. The `module` field matches the `__name__` the warning
# is ATTRIBUTED to (the `stacklevel` frame), not where the function lives; checked both
# ways before the switch.
filterwarnings = ["error::DeprecationWarning:gamepanel"]

[tool.ruff]
line-length = 120
target-version = "py313"
# Generated by tools/import-linuxgsm.py and tools/import-pterodactyl.py from third-party
# data (LinuxGSM, Pterodactyl eggs) - not hand-written, and the multi-line warning strings
# trigger ISC004 without being a real bug.
extend-exclude = ["src/gamepanel/games/catalog/suggestions.py",
                  "src/gamepanel/games/catalog/pterodactyl_suggestions.py"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",     # pyflakes/pycodestyle/imports/pyupgrade/bugbear
    "BLE",                          # generic except Exception (CLAUDE.md already assumes it for # noqa: BLE001)
    "S",                             # bandit: unsafe subprocess, hardcoded password/token, except-pass...
    "SIM", "RUF",                     # simplifications and ruff's own rules
    "C90",                              # complexity (mccabe) - a proxy for cognitive complexity
    "PLR",                                # pylint refactor: too-many-arguments, too-many-branches...
    "ERA",                                  # commented-out code
]
ignore = [
    # PLR2004 (a literal number in a comparison) was reviewed one by one: of the 19 there
    # were, one was the repository's own rule ("a literal repeated three times becomes a
    # constant") and became `catalog.MAX_PORT`, and two were screen policy and became
    # `app.GAUGE_HOT`/`GAUGE_WARN` (with a test tying them to format.js, which kept the
    # same numbers written again).
    #
    # The 13 left are PROTOCOL or format NUMBERS, and naming each one hurts readability:
    # `200 <= status < 300` (the HTTP success class), `1 <= start <= end <= 254` (the host
    # range of a /24), `hours > 48` (when the chart axis switches from hours to days),
    # `1024` (bytes in a KB). An `HTTP_OK_MIN = 200` teaches the reader nothing, and the
    # rule, firing 13 times on that, trains people to ignore ruff - the opposite of what it
    # exists for. To turn it back on: delete this line and run `ruff check src tests`.
    "PLR2004",
]
# The `# noqa` markers already in the code (e.g. `except Exception:  # noqa: BLE001` in
# gamebroker/ssh_install.py) only silence BLE001 with this selection - without it, RUF100
# would flag them as "unused noqa" (a Phase 1 finding, already fixed in the code, but it
# depended on this config existing).

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
# A dispatcher by type (bool/int/float/str/fallback) is a legitimate pattern with several
# returns; 6 (the default) flagged such code as "complex" with no gain in readability.
max-returns = 8

[tool.ruff.lint.per-file-ignores]
# Tests use asserts, synthetic data, fixture names with "senha"/"token", and sometimes a
# function with more than 8 parameters or more complex just to build a scenario - the bandit
# and parameter-count rules are for production code, not for tests.
"tests/**/*.py" = ["S", "PLR0913", "PLR0915", "PLR2004"]
# These three keep a REAL LINE as data: `startparameters=` from a LinuxGSM config,
# `OptionSettings=(...)` from Palworld and a line from the Enshrouded journal. Splitting them
# in two would make the test exercise an input that does not exist - and the length is
# precisely what the parser has to cope with. That is why E501 is turned off per FILE, and not
# with a stray `# noqa`.
"tests/gamebroker/unit/test_import_linuxgsm.py" = ["E501"]
# The same reason, with the `startup` of a Pterodactyl egg.
"tests/gamebroker/unit/test_import_pterodactyl.py" = ["E501"]
"tests/gamepanel/unit/test_config_format.py" = ["E501"]
"tests/gamepanel/integration/test_players.py" = ["E501"]

[tool.mypy]
platform = "linux"
