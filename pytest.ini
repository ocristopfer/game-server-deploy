[pytest]
# As suites do painel vivem em tests/gamepanel/, testando o pacote instalado (editavel,
# via uv) `gamepanel` em src/gamepanel/. As do broker vivem em tests/gamebroker/, testando
# `gamebroker` em src/gamebroker/. Import por nome de arquivo (`from conftest import X`,
# `from test_ssh_installer import Y`) funciona porque nem tests/ nem tests/<pacote>/ tem
# __init__.py: o pytest insere o diretorio de cada arquivo (nao a raiz do repo) no
# sys.path.
testpaths = tests
python_files = test_*.py

# -r fE: resumo no fim com as que falharam e as que deram erro. Sem isso, num arquivo
# de 40 testes, a linha que interessa fica perdida no meio da saida.
#
# -p no:cacheprovider: `src/gamepanel` entra no container de dev como bind mount SOMENTE
# LEITURA (docker-compose.yml) - e por isso que o codigo pode ser editado ao vivo sem
# rebuild. O cache de teste (".last failed", nodeids) quer escrever ali dentro e nao
# consegue; desligado, some o aviso sem perder nada, porque nenhuma suite aqui depende
# de cache entre execucoes.
addopts = -q -r fE -p no:cacheprovider

# O painel nao usa asyncio nem rede nos testes; qualquer aviso aqui e sinal de que
# algo novo entrou sem querer.
filterwarnings =
    error::DeprecationWarning:gamepanel.app
    error::DeprecationWarning:gamepanel.games.config_format
    error::DeprecationWarning:gamepanel.games.gamefields
