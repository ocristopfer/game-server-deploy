[pytest]
# As suites do painel vivem em admin/, ao lado do codigo que elas exercitam - nao ha
# pacote nem src/, e o `import app` delas depende disso (ver admin/conftest.py). Fase 3
# do refactor de arquitetura (docs/architecture-proposal.md) ainda nao moveu admin/.
#
# As suites do broker vivem em tests/gamebroker/, testando o pacote instalado (editavel,
# via uv) `gamebroker` em src/gamebroker/. Import por nome de arquivo (`from conftest
# import X`, `from test_ssh_install import Y`) continua igual ao padrao de admin/ - nem
# tests/ nem tests/gamebroker/ tem __init__.py, entao o pytest insere
# tests/gamebroker/ (nao a raiz do repo) no sys.path para esses arquivos.
testpaths = admin tests
python_files = test_*.py

# -r fE: resumo no fim com as que falharam e as que deram erro. Sem isso, num arquivo
# de 40 testes, a linha que interessa fica perdida no meio da saida.
#
# -p no:cacheprovider: `admin/` entra no container de dev como bind mount SOMENTE
# LEITURA (docker-compose.yml) - e por isso que o codigo pode ser editado ao vivo sem
# rebuild. O cache de teste (".last failed", nodeids) quer escrever ali dentro e nao
# consegue; desligado, some o aviso sem perder nada, porque nenhuma suite aqui depende
# de cache entre execucoes.
addopts = -q -r fE -p no:cacheprovider

# O painel nao usa asyncio nem rede nos testes; qualquer aviso aqui e sinal de que
# algo novo entrou sem querer.
filterwarnings =
    error::DeprecationWarning:app
    error::DeprecationWarning:gameconf
    error::DeprecationWarning:gamefields
