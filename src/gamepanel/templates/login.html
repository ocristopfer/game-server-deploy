{% extends "base.html" %}
{% import "components/ui.html" as ui with context %}
{% block title %}Entrar — Painel de Jogos{% endblock %}
{% block content %}
<div class="card card--login">
  <h1><span aria-hidden="true">🎮</span> {{ _('app.name') }}</h1>
  <p class="muted centro">{{ _('login.subtitle') }}</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>{{ _('login.username') }}
      <input name="username" autocomplete="username" autocapitalize="none"
             spellcheck="false" autofocus required>
    </label>
    <label>{{ _('login.password') }}
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <div class="form-actions">
      {{ ui.botao('Entrar', variante='primary', bloco=true) }}
    </div>
  </form>
</div>
{% endblock %}
