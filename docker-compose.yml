# Local environment for working on the panel without needing Proxmox.
#
#   docker compose up --build        (panel at http://localhost:8080, admin/admin12345)
#
# Starts the panel + two fake "game containers": Debian with sshd, a fake systemctl
# that starts/stops a process, a journalctl that reads that process's log, an A2S
# query server that reports players, a REST API shaped like Palworld's, and the files
# the real game would have (.ini, binary save, big log). It lets you test
# start/stop/update, resource gauges, the three ways of counting players, the
# interactive terminal, backup/restore, scheduling, alerts and the editor/upload/download
# end to end. The REST API also accepts kick/ban/announce (answering 200 with an empty
# body, like the real one) and records what it received in /run/fake-actions.log.
#
# The two containers are different on purpose: palworld has A2S query and the REST API,
# dragonwilds has neither (like the real game) and only announces in the log.
#
# The player count fluctuates on its own; to pin a value:
#   docker compose exec game-palworld sh -c 'echo 7 > /run/fake-players'
#
# The panel's SSH key is generated on first start and published in the 'panel-keys' volume;
# each game container installs it when it starts: game-palworld for the unprivileged gamepanel
# user (helper mode, root SSH refused), game-dragonwilds in root's authorized_keys (legacy mode).

services:
  panel:
    build: ./docker/panel
    container_name: gamepanel-dev
    ports:
      # Loopback only: this is the DEV panel, with admin/admin12345 and Flask reloading
      # code. Published on every interface, anyone on the same network could get in.
      - "127.0.0.1:8080:8080"
    environment:
      GAMEPANEL_DEV: "1"              # reloads templates and code on every save
      PANEL_SEED_DEMO: "1"            # registers the two fake containers below
      GAMEPANEL_ALLOW_SHELL: "1"
      GAMEPANEL_ALLOW_FILES: "1"
      GAMEPANEL_FILE_DEFAULT: "/opt/game"
      # localhost is a secure context for the browser: biometrics (Windows Hello, Touch ID) can be
      # tested without https. Open http://localhost:8080, not the IP, or the origin will not match.
      GAMEPANEL_WEBAUTHN_ORIGIN: "http://localhost:8080"
      # Toy broker below (fake backends). In production this stays OFF until the panel
      # has an extra layer in front of it (see the broker plan).
      GAMEPANEL_ALLOW_BROKER: "1"
      GAMEPANEL_BROKER_URL: "http://broker:8090"   # http is only allowed here: GAMEPANEL_DEV=1
      GAMEPANEL_BROKER_TOKEN_FILE: /run/secrets/broker-token
      PANEL_USER: admin
      PANEL_PASSWORD: admin12345
    secrets:
      - broker-token
    volumes:
      - ./src/gamepanel:/opt/gamepanel/gamepanel:ro   # code comes from the repo: edit and reload the page
      # Without this the dev panel reports itself as 0.0.0+dev: the version comes from the
      # root VERSION file, and here the package is mounted far away from it.
      - ./VERSION:/opt/gamepanel/VERSION:ro
      # Whole repo, only for `docker compose exec -w /workspace panel python3 -m pytest -q`
      # (see CLAUDE.md) - pytest.ini, tests/ and src/ must be together for pytest to find
      # the config and both packages; the mount above is only what the panel process serves.
      - .:/workspace:ro
      - panel-keys:/keys
      - panel-conf:/etc/gamepanel
      - panel-data:/var/lib/gamepanel
    depends_on:
      - game-palworld
      - game-dragonwilds
      - broker

  # Fake broker: the real one (catalog, allocator, quotas, API), but with fake Proxmox,
  # OPNsense and installer. Creating an instance takes ~10 s, with progress.
  # The "created" instances get 10.77.0.x IPs that do not exist: the panel will report
  # "sem contato" (no contact) for them, and that is expected.
  broker:
    build: ./docker/broker
    container_name: gamebroker-dev
    environment:
      BROKER_TOKEN_FILE: /run/secrets/broker-token
      BROKER_GAMES_DIR: /opt/gamebroker/games
      BROKER_DEV_PASSO: "1.5"
    secrets:
      - broker-token
    volumes:
      - ./src/gamebroker:/opt/gamebroker/gamebroker:ro
      - ./VERSION:/opt/gamebroker/VERSION:ro
      - ./games:/opt/gamebroker/games:ro

  game-palworld:
    build:
      context: ./docker/game
      # lib/ct-panel-access.sh, the piece that sets up helper mode (see docker/game/Dockerfile).
      additional_contexts:
        lib: ./lib
    # The -dev suffix avoids colliding with the real container from deploy-docker.ps1,
    # which is called game-palworld. Inside the compose network the service name still
    # resolves over DNS, so the panel finds the container as game-palworld.
    container_name: game-palworld-dev
    environment:
      GAME_KIND: palworld
      GAME_SERVICE: palworld.service
      # Helper mode: the panel logs in as gamepanel and uses sudo for gp-service, update-game
      # and as steam for files; root SSH is refused. Dragonwilds below stays root (legacy
      # mode), so both paths of the panel are exercised every day.
      GAME_SSH_USER: gamepanel
      # REST API on 127.0.0.1:8212, like the real Palworld one (admin/troque-me).
      # This is what exercises the HTTP player count in the panel's wizard.
      GAME_API: "1"
      GAME_API_PORT: "8212"
      GAME_API_PASSWORD: troque-me
    volumes:
      - panel-keys:/keys:ro
    # Limits like an LXC's: without them the cgroup has no ceiling and the panel's
    # gauges would show the memory and CPU of the whole machine.
    mem_limit: 1g
    cpus: 2

  game-dragonwilds:
    build:
      context: ./docker/game
      # lib/ct-panel-access.sh, the piece that sets up helper mode (see docker/game/Dockerfile).
      additional_contexts:
        lib: ./lib
    container_name: game-dragonwilds-dev
    environment:
      GAME_KIND: dragonwilds
      GAME_SERVICE: dragonwilds.service
      # Mimics the real game: opens 7777/udp but does NOT answer A2S queries, and only
      # announces joins and leaves in the log. This is the case where the panel's wizard
      # must conclude "the game process opened the port and did not answer" and send you
      # to the log tab.
      GAME_QUERY_A2S: "0"
      GAME_UDP_PORT: "7777"
      GAME_LOG_PLAYERS: "1"
    volumes:
      - panel-keys:/keys:ro
    mem_limit: 2g
    cpus: 1

secrets:
  # DEVELOPMENT token (not a secret, it only passes the length check). In production
  # the token is born inside the broker CT and never enters the repository.
  broker-token:
    file: ./docker/broker/dev-token

volumes:
  panel-keys:
  panel-conf:
  panel-data:
